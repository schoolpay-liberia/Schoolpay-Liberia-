<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SchoolPay Liberia</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial;margin:0;background:#f4f7fb;color:#172033}.top{background:#153e75;color:#fff;padding:18px;display:flex;justify-content:space-between}.wrap{max-width:1100px;margin:auto;padding:20px}.card{background:#fff;padding:18px;margin:14px 0;border-radius:14px;box-shadow:0 2px 12px #0001}button{background:#153e75;color:#fff;border:0;padding:11px 15px;border-radius:9px;margin:4px;cursor:pointer}input,select{width:100%;padding:11px;margin:5px 0;border:1px solid #ccd6e3;border-radius:8px;box-sizing:border-box}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #eee;text-align:left}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{font-size:28px;font-weight:bold}.login{max-width:450px;margin:8vh auto}@media(max-width:700px){.grid{grid-template-columns:1fr}}@media print{.no-print,.top{display:none}.receipt{box-shadow:none!important}}
</style></head><body><div id="app"></div><script>
const URL="https://kojknrbjhrkctuefvrpp.supabase.co",KEY="sb_publishable_fs3RMvWadGqx55xdFrosxQ_34LtxiFA",db=supabase.createClient(URL,KEY);
const A=document.getElementById("app");let schoolId;
const E=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c])),M=x=>"L$"+Number(x||0).toLocaleString();
function top(t="SchoolPay Liberia"){return `<div class=top><b>🏫 ${t}</b><span>Shem J Tokay — Creator</span></div>`}
function login(){A.innerHTML=top()+`<div class="card login"><h2>SchoolPay Liberia</h2><input id=e placeholder="Email"><input id=p type=password placeholder="Password"><button onclick="signin()">Login</button><button onclick=register()>Register your school</button><p>Online tuition management for Liberian schools.</p></div>`}
async function signin(){let{error}=await db.auth.signInWithPassword({email:e.value,password:p.value});if(error)return alert(error.message);route()}
function register(){A.innerHTML=top()+`<div class="card login"><h2>Register your school</h2><input id=n placeholder="School name"><input id=c placeholder="Register's name"><input id=ph placeholder="Phone"><input id=em placeholder="Email"><input id=pw type=password placeholder="Password"><button onclick=doRegister()>Submit</button><button onclick=login()>Back</button></div>`}
async function doRegister(){let{data,error}=await db.auth.signUp({email:em.value,password:pw.value});if(error)return alert(error.message);if(!data.user)return alert("Check your email, then log in.");let r=await db.rpc("register_school",{p_name:n.value,p_contact_name:c.value,p_contact_phone:ph.value,p_contact_email:em.value,p_logo_url:null});if(r.error)return alert(r.error.message);alert("Submitted for owner approval.");login()}
async function route(){let{data:u}=await db.auth.getUser();if(!u.user)return login();let{data:p,error}=await db.from("profiles").select("*").eq("id",u.user.id).single();if(error)return alert(error.message);if(p.role==="owner")return admin();schoolId=p.school_id;dash()}
function nav(){return `<p><button onclick=dash()>Dashboard</button><button onclick=students()>Students</button><button onclick=payments()>Payments</button><button onclick=receipts()>Receipts</button><button onclick=logout()>Log out</button></p>`}
async function dash(){let{s}=await school(),{data:st}=await db.from("students").select("id").eq("school_id",schoolId),{data:ps}=await db.from("payments").select("amount").eq("school_id",schoolId);A.innerHTML=top(s.name)+`<main class=wrap><h2>${E(s.name)}</h2>${nav()}<div class=grid><div class=card>Students<div class=stat>${st?.length||0}</div></div><div class=card>Payments<div class=stat>${ps?.length||0}</div></div><div class=card>Collected<div class=stat>${M((ps||[]).reduce((a,x)=>a+Number(x.amount),0))}</div></div></div><div class=card>Status: <b>${E(s.status)}</b><br>Subscription: ${E((s.subscription_expires_at||"").slice(0,10)||"Pending")}</div></main>`}
async function school(){let{data:s,error}=await db.from("schools").select("*").eq("id",schoolId).single();if(error)alert(error.message);return{s}}
async function students(){let{data:st}=await db.from("students").select("*").eq("school_id",schoolId).order("full_name");A.innerHTML=top()+`<main class=wrap><h2>Students</h2>${nav()}<div class=card><input id=i placeholder="Student ID"><input id=fn placeholder="Full name"><input id=cl placeholder="Class"><input id=tu type=number placeholder="Tuition amount"><button onclick=addStudent()>Save student</button></div><div class=card><table><tr><th>ID</th><th>Name</th><th>Class</th><th>Tuition</th></tr>${(st||[]).map(x=>`<tr><td>${E(x.student_id)}</td><td>${E(x.full_name)}</td><td>${E(x.class_name)}</td><td>${M(x.tuition_amount)}</td></tr>`).join("")}</table></div></main>`}
async function addStudent(){let{error}=await db.from("students").insert({school_id:schoolId,student_id:i.value,full_name:fn.value,class_name:cl.value,tuition_amount:Number(tu.value||0)});if(error)return alert(error.message);students()}
async function payments(){let{data:st}=await db.from("students").select("*").eq("school_id",schoolId);A.innerHTML=top()+`<main class=wrap><h2>Record Payment</h2>${nav()}<div class=card><select id=si>${(st||[]).map(x=>`<option value=${x.id}>${E(x.full_name)} — ${E(x.student_id)}</option>`).join("")}</select><input id=am type=number placeholder="Amount"><select id=me><option>cash</option><option>mobile_money</option><option>bank</option><option>other</option></select><input id=rn placeholder="Receipt number (optional)"><button onclick=savePay()>Save payment</button></div></main>`}
async function savePay(){let{data:u}=await db.auth.getUser(),r=rn.value||"SP-"+Date.now(),x={school_id:schoolId,student_id:si.value,amount:Number(am.value),payment_method:me.value,receipt_number:r,entered_by:u.user.id};let{error}=await db.from("payments").insert(x);if(error)return alert(error.message);alert("Payment saved.");receipts()}
async function receipts(){let{data:ps}=await db.from("payments").select("*,students(full_name,student_id,class_name)").eq("school_id",schoolId).order("paid_at",{ascending:false});A.innerHTML=top()+`<main class=wrap><h2>Receipts</h2>${nav()}<div class=card><table><tr><th>Receipt</th><th>Student</th><th>Amount</th><th></th></tr>${(ps||[]).map(x=>`<tr><td>${E(x.receipt_number)}</td><td>${E(x.students?.full_name)}</td><td>${M(x.amount)}</td><td><button onclick='printR(${JSON.stringify(x)})'>Print</button></td></tr>`).join("")}</table></div></main>`}
function printR(x){A.innerHTML=`<div class=no-print><button onclick=receipts()>Back</button><button onclick=print()>Ctrl P / Print</button></div><div class="card receipt"><h2 style=text-align:center>SchoolPay Liberia</h2><h3 style=text-align:center>TUITION RECEIPT</h3><hr><p><b>Receipt:</b> ${E(x.receipt_number)}</p><p><b>Student:</b> ${E(x.students?.full_name)}</p><p><b>Student ID:</b> ${E(x.students?.student_id)}</p><p><b>Class:</b> ${E(x.students?.class_name)}</p><p><b>Amount:</b> ${M(x.amount)}</p><p><b>Method:</b> ${E(x.payment_method)}</p><p><b>Date:</b> ${new Date(x.paid_at).toLocaleString()}</p><hr><p style=text-align:center>Shem J Tokay — Creator</p></div>`}
async function admin(){let{data:ss,error}=await db.from("schools").select("*").order("created_at",{ascending:false});if(error)return alert(error.message);A.innerHTML=top("SchoolPay Liberia — Owner")+`<main class=wrap><h2>Admin Dashboard</h2><button onclick=logout()>Log out</button><div class=grid><div class=card>Schools<div class=stat>${ss.length}</div></div><div class=card>Pending<div class=stat>${ss.filter(x=>x.status=="pending").length}</div></div><div class=card>Active<div class=stat>${ss.filter(x=>x.status=="active").length}</div></div></div><div class=card><table><tr><th>School</th><th>Contact</th><th>Status</th><th></th></tr>${ss.map(s=>`<tr><td>${E(s.name)}</td><td>${E(s.contact_name)}<br>${E(s.contact_phone)}</td><td>${E(s.status)}</td><td>${s.status=="pending"?`<button onclick="approve('${s.id}')">Approve 6 months</button>`:""}</td></tr>`).join("")}</table></div></main>`}
async function approve(id){let{error}=await db.rpc("admin_approve_school",{p_school_id:id,p_months:6});if(error)return alert(error.message);admin()}
async function logout(){await db.auth.signOut();login()}
login();
</script></body></html>
