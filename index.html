  </style>  </head>  <body>  <header>  
  <h1>🏫 SchoolPay Liberia</h1>  
  <p>School Management • Payments • Subscriptions</p>  
</header>  <main id="app"></main>  <script>  
  
const SUPABASE_URL =  
  "https://kojknrbjhrkctuefvrpp.supabase.co";  
  
const SUPABASE_KEY =  
  "sb_publishable_fs3RMvWadGqx55xdFrosxQ_34LtxiFA";  
  
let accessToken =  
  localStorage.getItem("schoolpay_token") || "";  
  
const app = document.getElementById("app");  
  
  
/* =========================  
   SUPABASE CONNECTION  
========================= */  
  
async function supabase(path, options = {}) {  
  
  const headers = {  
    "apikey": SUPABASE_KEY,  
    "Content-Type": "application/json",  
    ...(options.headers || {})  
  };  
  
  if (accessToken) {  
    headers["Authorization"] =  
      "Bearer " + accessToken;  
  }  
  
  const response = await fetch(  
    SUPABASE_URL + path,  
    {  
      ...options,  
      headers  
    }  
  );  
  
  const text = await response.text();  
  
  let data = null;  
  
  try {  
    data = text ? JSON.parse(text) : null;  
  } catch {  
    data = null;  
  }  
  
  if (!response.ok) {  
  
    throw new Error(  
      data?.message ||  
      data?.msg ||  
      data?.error_description ||  
      text ||  
      "Supabase request failed"  
    );  
  }  
  
  return data;  
}  
  
  
/* =========================  
   HOME / LOGIN  
========================= */  
  
function showLogin() {  
  
  app.innerHTML = `  
  
    <div class="card">  
  
      <h2>School Login</h2>  
  
      <input  
        id="loginEmail"  
        type="email"  
        placeholder="Email"  
      >  
  
      <input  
        id="loginPassword"  
        type="password"  
        placeholder="Password"  
      >  
  
      <button onclick="schoolLogin()">  
        Login  
      </button>  
  
      <button  
        class="secondary"  
        onclick="showRegistration()">  
        Register Your School  
      </button>  
  
      <button  
        class="secondary"  
        onclick="showAdminLogin()">  
        Owner / Admin  
      </button>  
  
    </div>  
  `;  
}  
  
  
/* =========================  
   SCHOOL LOGIN  
========================= */  
  
async function schoolLogin() {  
  
  try {  
  
    const result = await supabase(  
      "/auth/v1/token?grant_type=password",  
      {  
        method: "POST",  
  
        body: JSON.stringify({  
          email: loginEmail.value,  
          password: loginPassword.value  
        })  
      }  
    );  
  
    accessToken = result.access_token;  
  
    localStorage.setItem(  
      "schoolpay_token",  
      accessToken  
    );  
  
    showSchoolDashboard();  
  
  } catch (error) {  
  
    alert(  
      "Login failed:\n\n" +  
      error.message  
    );  
  }  
}  
  
  
/* =========================  
   SCHOOL REGISTRATION  
========================= */  
  
function showRegistration() {  
  
  app.innerHTML = `  
  
    <div class="card">  
  
      <h2>Register Your School</h2>  
  
      <input  
        id="schoolName"  
        placeholder="School name"  
      >  
  
      <input  
        id="contactName"  
        placeholder="Contact person's name"  
      >  
  
      <input  
        id="schoolPhone"  
        placeholder="Phone number"  
      >  
  
      <input  
        id="schoolEmail"  
        type="email"  
        placeholder="Email"  
      >  
  
      <input  
        id="schoolPassword"  
        type="password"  
        placeholder="Password"  
      >  
  
      <button onclick="registerSchool()">  
        Submit Registration  
      </button>  
  
      <button  
        class="secondary"  
        onclick="showLogin()">  
        Back  
      </button>  
  
    </div>  
  `;  
}  
  
  
async function registerSchool() {  
  
  try {  
  
    const account = await supabase(  
      "/auth/v1/signup",  
      {  
        method: "POST",  
  
        body: JSON.stringify({  
          email: schoolEmail.value,  
          password: schoolPassword.value  
        })  
      }  
    );  
  
    if (account.access_token) {  
  
      accessToken =  
        account.access_token;  
  
      localStorage.setItem(  
        "schoolpay_token",  
        accessToken  
      );  
    }  
  
    await supabase(  
      "/rest/v1/rpc/register_school",  
      {  
        method: "POST",  
  
        body: JSON.stringify({  
          p_name: schoolName.value,  
          p_contact_name: contactName.value,  
          p_contact_phone: schoolPhone.value,  
          p_contact_email: schoolEmail.value,  
          p_logo_url: null  
        })  
      }  
    );  
  
    alert(  
      "Your school registration has been submitted."  
    );  
  
    showLogin();  
  
  } catch (error) {  
  
    alert(  
      "Registration failed:\n\n" +  
      error.message  
    );  
  }  
}  
  
  
/* =========================  
   SCHOOL DASHBOARD  
========================= */

  app.innerHTML = `  
  
    <h2>School Dashboard</h2>  
  
    <div class="grid">  
  
      <div class="stat">  
        Students  
        <b id="studentCount">0</b>  
      </div>  
  
      <div class="stat">  
        Payments  
        <b>L$—</b>  
      </div>  
  
    </div>  
  
    <div class="card">  
  
      <div class="success">  
        ✓ School account connected  
      </div>  
  
      <button onclick="showStudents()">  
        👨‍🎓 Students  
      </button>  
  
      <button onclick="showPayments()">  
        💰 Payments  
      </button>  
  
      <button onclick="showRenewal()">  
        📅 Subscription / Renewal  
      </button>  
  
    </div>  
  
    <button  
      class="secondary"  
      onclick="logout()">  
      Log out  
    </button>  
  `;  
  
  try {  
  
    const students =  
      await supabase(  
        "/rest/v1/students?select=id"  
      );  
  
    document.getElementById(  
      "studentCount"  
    ).textContent = students.length;  
  
  } catch {  
  
    document.getElementById(  
      "studentCount"  
    ).textContent = "0";  
  }  
}  
  
  
/* =========================  
   STUDENTS  
========================= */

  app.innerHTML = `

      <input  
        id="studentName"  
        placeholder="Student name"  
      >  
  
      <input  
        id="studentId"  
        placeholder="Student ID"  
      >  
  
      <select id="studentGrade">  
  
        <option value="">  
          Select Class / Grade  
        </option>  
  
        <option>Grade 7</option>  
        <option>Grade 8</option>  
        <option>Grade 9</option>  
        <option>Grade 10</option>  
        <option>Grade 11</option>  
        <option>Grade 12</option>  
  
      </select>  
  
      <button onclick="addStudent()">  
        Save Student  
      </button>  
  
      <button  
        class="secondary"  
        onclick="showSchoolDashboard()">  
        Back  
      </button>  
  
    </div>  
  `;  
}  
  
  
async function addStudent() {  
  
  try {  
  
    await supabase(  
      "/rest/v1/students",  
      {  
        method: "POST",  
  
        headers: {  
          "Prefer": "return=minimal"  
        },  
  
        body: JSON.stringify({  
  
          student_name:  
            studentName.value,  
  
          student_id:  
            studentId.value,  
  
          grade:  
            studentGrade.value  
        })  
      }  
    );  
  
    alert("Student saved successfully.");  
  
    showSchoolDashboard();  
  
  } catch (error) {  
  
    alert(  
      "Could not save student:\n\n" +  
      error.message  
    );  
  }  
}  
  
  
/* =========================  
   PAYMENTS  
========================= */  
  
function showPayments() {  
  
  app.innerHTML = `  
  
    <div class="card">  
  
      <h2>Record Payment</h2>  
  
      <input  
        id="paymentStudentId"  
        placeholder="Student ID"  
      >  
  
      <input  
        id="paymentAmount"  
        type="number"  
        placeholder="Amount (L$)"  
      >  
  
      <input  
        id="paymentReference"  
        placeholder="Transaction reference"  
      >  
  
      <button onclick="recordPayment()">  
        Record Payment  
      </button>  
  
      <button  
        class="secondary"

      </button>

}  
  
  
async function recordPayment() {  
  
  try {

      {

        headers: {  
          "Prefer": "return=minimal"  
        },  
  
        body: JSON.stringify({  
  
          student_id:  
            paymentStudentId.value,  
  
          amount:

          transaction_reference:

      }  
    );  
  
    alert("Payment recorded successfully.");

        for owner approval.

async function submitRenewal() {

    await supabase(  
      "/rest/v1/rpc/submit_subscription_renewal",  
      {  
        method: "POST",  
  
        body: JSON.stringify({  
  
          p_amount:  
            renewAmount.value,  
  
          p_transaction_reference:  
            renewReference.value,

/* =========================  
   OWNER / ADMIN LOGIN  
========================= */

  app.innerHTML = `  
  
    <div class="card">  
  
      <h2>Owner / Admin</h2>  
  
      <input  
        id="adminEmail"  
        type="email"  
        placeholder="Admin email"  
      >  
  
      <input  
        id="adminPassword"  
        type="password"  
        placeholder="Admin password"  
      >  
  
      <button onclick="adminLogin()">  
        Sign In  
      </button>  
  
      <button  
        class="secondary"  
        onclick="showLogin()">  
        Back  
      </button>  
  
    </div>  
  `;  
}  
  
  
async function adminLogin() {  
  
  try {  
  
    const result = await supabase(  
      "/auth/v1/token?grant_type=password",  
      {  
        method: "POST",  
  
        body: JSON.stringify({  
  
          email:  
            adminEmail.value,  
  
          password:  
            adminPassword.value  
  
        })  
      }  
    );  
  
    accessToken =  
      result.access_token;  
  
    localStorage.setItem(  
      "schoolpay_token",  
      accessToken  
    );  
  
    const owner =  
      await supabase(  
        "/rest/v1/rpc/is_owner",  
        {  
          method: "POST"  
        }  
      );  
  
    if (!owner) {  
  
      throw new Error(  
        "This account is not an owner account."  
      );  
    }  
  
    showAdminDashboard();  
  
  } catch (error) {  
  
    alert(  
      "Admin login failed:\n\n" +  
      error.message  
    );  
  }  
}  
  
  
/* =========================  
   OWNER DASHBOARD  
========================= */  
  
async function showAdminDashboard() {  
  
  try {  
  
    const schools =  
      await supabase(  
        "/rest/v1/schools?select=*&order=created_at.desc"  
      );  
  
    let schoolList = "";  
  
    if (schools.length === 0) {  
  
      schoolList =  
        "<p>No schools registered yet.</p>";  
  
    } else {  
  
      schools.forEach(function(school) {  
  
        schoolList += `  
  
          <div class="school">  
  
            <b>  
              ${school.name || "School"}  
            </b>  
  
            <br>  
  
            Status:  
            ${school.status || "Pending"}  
  
          </div>  
  
        `;  
      });  
    }  
  
    app.innerHTML = `  
  
      <h2>👑 Owner Dashboard</h2>  
  
      <div class="card">  
  
        <h3>Registered Schools</h3>  
  
        ${schoolList}  
  
      </div>  
  
      <div class="card">  
  
        <h3>Subscriptions</h3>  
  
        <p>  
          Review school subscriptions  
          and renewal requests.  
        </p>  
  
      </div>  
  
      <button  
        class="secondary"  
        onclick="logout()">  
        Log out  
      </button>  
  
    `;  
  
  } catch (error) {  
  
    alert(  
      "Could not load Admin Dashboard:\n\n" +  
      error.message  
    );  
  }  
}  
  
  
/* =========================  
   LOGOUT  
========================= */  
  
function logout() {  
  
  accessToken = "";  
  
  localStorage.removeItem(  
    "schoolpay_token"  
  );  
  
  showLogin();  
}  
  
  
/* =========================  
   START APP  
========================= */  
  
showLogin();  
  
</script>  </body>
