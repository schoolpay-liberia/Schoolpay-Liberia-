/* =========================
   SUPABASE CONNECTION
========================= */

async function supabase(path, options = {}) {

  const headers = {
    "apikey": SUPABASE_KEY,
    "Content-Type": "application/json",
    ...(options.headers || {})
  };

  if (accessToken) {
    headers["Authorization"] =
      "Bearer " + accessToken;
  }

  const response = await fetch(
    SUPABASE_URL + path,
    {
      ...options,
      headers
    }
  );

  const text = await response.text();

  let data = null;

  try {
    data = text ? JSON.parse(text) : null;
  } catch {
    data = null;
  }

  if (!response.ok) {

    throw new Error(
      data?.message ||
      data?.msg ||
      data?.error_description ||
      text ||
      "Supabase request failed"
    );
  }

  return data;
}


/* =========================
   HELPERS
========================= */

function escapeHtml(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


function money(value) {

  return "L$" +
    Number(value || 0).toLocaleString(
      "en-US",
      {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      }
    );
}


async function getMySchoolId() {

  const result =
    await supabase(
      "/rest/v1/rpc/my_school_id",
      {
        method: "POST",
        body: "{}"
      }
    );

  if (!result) {
    throw new Error(
      "Your school account is not connected to a school."
    );
  }

  return result;
}

async function registerSchool() {

  try {

    if (!schoolName.value.trim()) {
      throw new Error("Please enter the school name.");
    }

    if (!schoolEmail.value.trim()) {
      throw new Error("Please enter the school email.");
    }

    if (!schoolPassword.value) {
      throw new Error("Please enter a password.");
    }

    const account = await supabase(
      "/auth/v1/signup",
      {
        method: "POST",

        body: JSON.stringify({
          email:
            schoolEmail.value.trim(),
          password:
            schoolPassword.value
        })
      }
    );

    if (account.access_token) {

      accessToken =
        account.access_token;

      localStorage.setItem(
        "schoolpay_token",
        accessToken
      );
    }

    await supabase(
      "/rest/v1/rpc/register_school",
      {
        method: "POST",

        body: JSON.stringify({
          p_name:
            schoolName.value.trim(),

          p_contact_name:
            contactName.value.trim(),

          p_contact_phone:
            schoolPhone.value.trim(),

          p_contact_email:
            schoolEmail.value.trim(),

          p_logo_url:
            null
        })
      }
    );

    alert(
      "Your school registration has been submitted and is waiting for owner approval."
    );

    showLogin();

  } catch (error) {

    alert(
      "Registration failed:\n\n" +
      error.message
    );
  }
}

async function addStudent() {

  try {

    const schoolId =
      await getMySchoolId();

    const fullName =
      studentName.value.trim();

    const studentNumber =
      studentId.value.trim();

    const grade =
      studentGrade.value;

    const tuition =
      Number(tuitionAmount.value || 0);

    if (!fullName) {
      throw new Error(
        "Please enter the student's full name."
      );
    }

    if (!studentNumber) {
      throw new Error(
        "Please enter the student ID."
      );
    }

    if (!grade) {
      throw new Error(
        "Please select the student's class."
      );
    }

    if (tuition < 0) {
      throw new Error(
        "Tuition amount cannot be negative."
      );
    }

    await supabase(
      "/rest/v1/students",
      {
        method: "POST",

        headers: {
          "Prefer":
            "return=minimal"
        },

        body: JSON.stringify({

          school_id:
            schoolId,

          student_id:
            studentNumber,

          full_name:
            fullName,

          class_name:
            grade,

          tuition_amount:
            tuition,

          student_name:
            fullName,

          grade:
            grade

    );

    alert(
      "Student registered successfully."
    );

    showStudentList();

  } catch (error) {

    alert(
      "Could not register student:\n\n" +
      error.message
    );
  }
}

function updatePaymentInfo() {

  const select =
    document.getElementById(
      "paymentStudentId"
    );

  const info =
    document.getElementById(
      "paymentInfo"
    );

  if (!select || !info) {
    return;
  }

  const student =
    (window.schoolStudents || [])
      .find(
        s => s.id === select.value
      );

  if (!student) {

    info.innerHTML =
      "Select a student to see tuition information.";

    return;
  }

  calculateStudentBalance(
    student
  ).then(function(data) {

    info.innerHTML = `

      <strong>
        ${escapeHtml(
          student.full_name ||
          student.student_name
        )}
      </strong>

      <br>

      Tuition:
      ${money(student.tuition_amount)}

      <br>

      Already Paid:
      ${money(data.paid)}

      <br>

      <strong>
        Remaining Balance:
        ${money(data.balance)}
      </strong>
    `;

  }).catch(function() {

    info.innerHTML = `

      <strong>
        ${escapeHtml(
          student.full_name ||
          student.student_name
        )}
      </strong>

      <br>

      Tuition:
      ${money(student.tuition_amount)}
    `;
  });
}


async function calculateStudentBalance(student) {

  const payments =
    await supabase(
      "/rest/v1/payments?student_id=eq." +
      encodeURIComponent(student.id) +
      "&select=amount"
    );

  const paid =
    payments.reduce(
      (sum, payment) =>
        sum + Number(payment.amount || 0),
      0
    );

  const tuition =
    Number(student.tuition_amount || 0);

  return {

    tuition:
      tuition,

    paid:
      paid,

    balance:
      Math.max(0, tuition - paid)
  };
}
