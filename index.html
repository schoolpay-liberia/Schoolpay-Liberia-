/* =========================
   SUPABASE CONNECTION
========================= */

async function supabase(path,options={}){

 const headers={
   apikey:SUPABASE_KEY,
   "Content-Type":"application/json",
   ...(options.headers||{})
 };

 if(accessToken){
   headers.Authorization=
   "Bearer "+accessToken;
 }

 const response=
 await fetch(
   SUPABASE_URL+path,
   {
     ...options,
     headers
   }
 );

 const text=
 await response.text();

 let data=null;

 try{
   data=text?JSON.parse(text):null;
 }catch{
   data=null;
 }

 if(!response.ok){

   throw new Error(
     data?.message||
     data?.msg||
     data?.error_description||
     text||
     "Supabase request failed"
   );
 }

 return data;
}


function saveSession(result){

 if(result?.access_token){

   accessToken=
   result.access_token;

   localStorage.setItem(
     "schoolpay_token",
     accessToken
   );
 }
}


function escapeHtml(value){

 return String(value??"")
 .replaceAll("&","&amp;")
 .replaceAll("<","&lt;")
 .replaceAll(">","&gt;")
 .replaceAll('"',"&quot;")
 .replaceAll("'","&#039;");
}


function escapeJs(value){

 return String(value??"")
 .replaceAll("\\","\\\\")
 .replaceAll("'","\\'")
 .replaceAll("\n","\\n")
 .replaceAll("\r","\\r");
}

   GET MY SCHOOL
========================= */

async function getMySchool(){

 const rows=
 await supabase(
   "/rest/v1/schools?select=*&limit=1"
 );

 if(!rows?.length){

     "No school account was found."
   );
 }

 return rows[0];
}

async function registerSchool(){

 try{

   const name=
   document.getElementById(
     "schoolName"
   ).value.trim();

   const contact=
   document.getElementById(
     "contactName"
   ).value.trim();

   const phone=
   document.getElementById(
     "schoolPhone"
   ).value.trim();

   const email=
   document.getElementById(
     "schoolEmail"
   ).value.trim();

   const password=
   document.getElementById(
     "schoolPassword"
   ).value;

   if(!name||!email||!password){

     throw new Error(
       "School name, email and password are required."
     );
   }

   const account=
   await supabase(
     "/auth/v1/signup",
     {
       method:"POST",

       body:JSON.stringify({
         email,
         password
       })
     }
   );

   if(account?.access_token){
     saveSession(account);
   }

   await supabase(
     "/rest/v1/rpc/register_school",
     {
       method:"POST",

       body:JSON.stringify({

         p_name:name,

         p_contact_name:contact,

         p_contact_phone:phone,

         p_contact_email:email,

         p_logo_url:null

       })
     }
   );

   alert(
     "Your school registration has been submitted."
   );

   logout();

 }catch(error){

   alert(
     "Registration failed:\n\n"+
     error.message
   );
 }
}

async function showSchoolDashboard(){

 app.innerHTML=`

   </div>

   </button>

   </button>

   <button onclick="showPaymentHistory()">
     📜 Payment History
   </button>

   <button onclick="showRenewal()">
     📅 Subscription / Renewal
   </button>

 </div>

 <button
   class="secondary"
   onclick="logout()">

   Log out

 </button>

 `;


 try{

   const school=
   await getMySchool();

   const status=
   String(
     school.status||"pending"
   ).toLowerCase();

   const expiry=
   school.subscription_expires_at
   ?new Date(
     school.subscription_expires_at
   )
   :null;

   const active=
   status==="active" &&
   expiry &&
   expiry>=new Date();

   document.getElementById(
     "schoolStatus"
   ).innerHTML=

   active

   ?`✓ ${escapeHtml(
       school.name
     )} — Subscription active until ${
       expiry.toLocaleDateString()
     }`

   :`⚠ ${escapeHtml(
       school.name
     )} — Account status: ${
       escapeHtml(
         school.status||"Pending"
       )
     }`;

 }catch(error){

   document.getElementById(
     "schoolStatus"
   ).innerHTML=
   "⚠ "+
   escapeHtml(error.message);
 }


 try{

   const students=
   await supabase(
     "/rest/v1/students?select=id"
   );

   document.getElementById(
     "studentCount"
   ).textContent=
   students.length;

 }catch{

   document.getElementById(
     "studentCount"
   ).textContent="0";
 }


 try{

   const payments=
   await supabase(
     "/rest/v1/payments?select=amount"
   );

   const total=
   payments.reduce(
     (a,p)=>
       a+Number(p.amount||0),
     0

     "paymentTotal"
   ).textContent=
   "L$"+
   total.toLocaleString();

 }catch{

   document.getElementById(
     "paymentTotal"
   ).textContent="L$0";
 }
}

/* =========================

async function addStudent(){

 try{

   const id=
   document.getElementById(
     "studentId"
   ).value.trim();

   const name=
   document.getElementById(
     "studentName"
   ).value.trim();

   const grade=
   document.getElementById(
     "studentGrade"
   ).value;

   const tuition=
   Number(
     document.getElementById(
       "tuitionAmount"
     ).value
   );

   if(!id||!name||!grade){

     throw new Error(
       "Student ID, name and class are required."
     );
   }

   if(
     Number.isNaN(tuition)||
     tuition<0
   ){

     throw new Error(
       "Please enter a valid tuition amount."
     );
   }

   await supabase(
     "/rest/v1/rpc/add_student",
     {
       method:"POST",

       body:JSON.stringify({

         p_student_id:id,

         p_full_name:name,

         p_class_name:grade,

         p_tuition_amount:tuition

       })
     }
   );

   alert(
     "Student saved successfully."
   );

   showStudents();

 }catch(error){

   alert(
     "Could not save student:\n\n"+
     error.message
   );
 }


}

/* =========================
   FIND STUDENT FOR PAYMENT
========================= */

async function findStudentForPayment(){

 const id=
 document.getElementById(
   "paymentStudentId"
 ).value.trim();

 const box=
 document.getElementById(
   "paymentStudentInfo"
 );

 selectedStudent=null;

 if(!id){

   box.innerHTML="";
   return;
 }

 try{

   const rows=
   await supabase(
     "/rest/v1/students?select=id,student_id,full_name,class_name,tuition_amount,student_name,grade&student_id=eq."+
     encodeURIComponent(id)+
     "&limit=1"
   );

   if(!rows.length){

     box.innerHTML=
     `<div class="error">
       Student not found.
     </div>`;

     return;
   }

   selectedStudent=
   rows[0];

   const summary=
   await supabase(
     "/rest/v1/rpc/get_student_payment_summary",
     {
       method:"POST",

       body:JSON.stringify({
         p_student_id:id
       })
     }
   );

   const s=
   Array.isArray(summary)
   ?summary[0]
   :summary;

   box.innerHTML=`

   <div class="student-box">

     <strong>
       ${escapeHtml(
         s?.student_name||
         selectedStudent.full_name||
         selectedStudent.student_name
       )}
     </strong>

     <br>

     Class:
     ${escapeHtml(
       s?.class_name||
       selectedStudent.class_name||
       selectedStudent.grade||
       ""
     )}

     <br>

     Tuition:
     L$${Number(
       s?.tuition_amount||
       selectedStudent.tuition_amount||
       0
     ).toLocaleString()}

     <br>

     Paid:
     L$${Number(
       s?.total_paid||0
     ).toLocaleString()}

     <br>

     <strong>
       Balance:
       L$${Number(
         s?.remaining_balance||0
       ).toLocaleString()}
     </strong>

   </div>

   `;

 }catch(error){

   box.innerHTML=
   `<div class="error">

     ${escapeHtml(
       error.message
     )}

   </div>`;
 }
}


/* =========================
   RECORD PAYMENT
========================= */

async function recordPayment(){

 try{

   const id=
   document.getElementById(
     "paymentStudentId"
   ).value.trim();

   const amount=
   Number(
     document.getElementById(
       "paymentAmount"
     ).value
   );

   const method=
   document.getElementById(
     "paymentMethod"
   ).value;

   const notes=
   document.getElementById(
     "paymentNotes"
   ).value.trim();

   if(!id){

     throw new Error(
       "Please enter a Student ID."
     );
   }

   if(!amount||amount<=0){

     throw new Error(
       "Please enter a valid payment amount."
     );
   }

   if(!method){

     throw new Error(
       "Please select a payment method."
     );
   }

   const result=
   await supabase(
     "/rest/v1/rpc/record_student_payment",
     {
       method:"POST",

       body:JSON.stringify({

         p_student_id:id,

         p_amount:amount,

         p_payment_method:method,

         p_notes:
           notes||null

       })
     }
   );

   const receipt=
   Array.isArray(result)
   ?result[0]
   :result;

   if(!receipt){

     throw new Error(
       "Payment was saved but no receipt was returned."
     );
   }

   showReceipt(receipt);

 }catch(error){

   alert(
     "Could not record payment:\n\n"+
     error.message
   );
 }
}

async function submitRenewal(){

 try{

   const amount=
   Number(
     document.getElementById(
       "renewAmount"
     ).value
   );

   const ref=
   document.getElementById(
     "renewReference"
   ).value.trim();

   const notes=
   document.getElementById(
     "renewNotes"
   ).value.trim();

   if(
     Number.isNaN(amount)||
     amount<0
   ){

     throw new Error(
       "Enter a valid amount."
     );
   }

   if(!ref){

     throw new Error(
       "Transaction reference is required."
     );
   }

   await supabase(
     "/rest/v1/rpc/submit_subscription_renewal",
     {
       method:"POST",

       body:JSON.stringify({

         p_amount:
           amount,

         p_transaction_reference:
           ref,

         p_notes:
           notes||null

       })
     }
   );

   alert(
     "Renewal request submitted for owner review."
   );

   showSchoolDashboard();

 }catch(error){

   alert(
     "Could not submit renewal:\n\n"+
     error.message
   );
 }
}

async function adminLogin(){

async function loadAdminSchools(){

 const box=
 document.getElementById(
   "adminSchools"
 );

 try{

   const rows=
   await supabase(
     "/rest/v1/schools?select=*&order=created_at.desc"
   );

   if(!rows.length){

     box.innerHTML=
       "<p>No schools registered yet.</p>";

     return;
   }


   box.innerHTML=

   rows.map(
     school=>{

       const status=
       String(
         school.status||
         "pending"
       ).toLowerCase();


       const cls=

       status==="pending"
       ?"status-pending"

       :

       status==="active"
       ?"status-approved"

       :

       status==="rejected"
       ?"status-rejected"

       :
       "status-other";


       return `

       <div class="school">

         <b>
           ${escapeHtml(
             school.name||
             "School"
           )}
         </b>

         <br>

         Contact:
         ${escapeHtml(
           school.contact_name||
           "N/A"
         )}

         <br>

         Phone:
         ${escapeHtml(
           school.contact_phone||
           "N/A"
         )}

         <br>

         Email:
         ${escapeHtml(
           school.contact_email||
           "N/A"
         )}

         <br>

         Status:

         <span
           class="status ${cls}">

           ${escapeHtml(
             school.status||
             "Pending"
           )}

         </span>

         ${
           school.subscription_expires_at

           ?`

           <br>

           Subscription expires:

           ${new Date(
             school.subscription_expires_at
           ).toLocaleString()}

           `

           :""
         }


         <div
           class="school-actions">

           ${
             status==="pending"

             ?`

             <button
               class="success-btn small-btn"
               onclick="approveSchool(
                 '${escapeJs(
                   school.id
                 )}',
                 '${escapeJs(
                   school.name||
                   "this school"
                 )}'
               )">

               ✓ Approve

             </button>


             <button
               class="danger-btn small-btn"
               onclick="rejectSchool(
                 '${escapeJs(
                   school.id
                 )}',
                 '${escapeJs(
                   school.name||
                   "this school"
                 )}'
               )">

               ✕ Reject

             </button>

             `

             :""
           }


           <button
             class="danger-btn small-btn"
             onclick="deleteSchool(
               '${escapeJs(
                 school.id
               )}',
               '${escapeJs(
                 school.name||
                 "this school"
               )}'
             )">

             🗑 Remove School

           </button>

         </div>

       </div>

       `;

     }
   ).join("");


 }catch(error){

   box.innerHTML=

   `<p class="error">

     Could not load schools:

     ${escapeHtml(
       error.message
     )}

   </p>`;
 }
}

/* =========================

========================= */

async function reviewRenewal(
 id,
 approve
){

 const notes=
 prompt(
   approve
   ?"Optional approval note:"
   :"Reason for rejection (optional):",
   ""
 );


 try{

   await supabase(
     "/rest/v1/rpc/admin_review_renewal",
     {
       method:"POST",

       body:JSON.stringify({

         p_renewal_id:
           id,

         p_approve:
           approve,

         p_months:
           6,

         p_notes:
           notes||null

       })
     }
   );


   alert(

     approve

     ?"Subscription renewal approved successfully."

     :

     "Subscription renewal rejected successfully."

   );


   showAdminDashboard();


 }catch(error){

   alert(
     "Could not review subscription:\n\n"+
     error.message
   );
 }
}


function approveSubscription(
 id
){

 if(
   confirm(
     "Approve this subscription renewal for 6 months?"
   )
 ){

   reviewRenewal(
     id,
     true
   );

 }
}


function rejectSubscription(
 id
){

 if(
   confirm(
     "Reject this subscription renewal?"
   )
 ){

   reviewRenewal(
     id,
     false
   );

 }
}
