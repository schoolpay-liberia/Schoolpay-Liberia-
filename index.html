/* =========================
   SUPABASE CONNECTION
========================= */

async function supabase(path, options = {}) {

  const headers = {
    "apikey": SUPABASE_KEY,
    "Content-Type": "application/json",
    ...(options.headers || {})
  };

  if (accessToken) {
    headers["Authorization"] =
      "Bearer " + accessToken;
  }

  const response = await fetch(
    SUPABASE_URL + path,
    {
      ...options,
      headers
    }
  );

  const text = await response.text();

  let data = null;

  try {
    data = text ? JSON.parse(text) : null;
  } catch {
    data = null;
  }

  if (!response.ok) {

    throw new Error(
      data?.message ||
      data?.msg ||
      data?.error_description ||
      text ||
      "Supabase request failed"
    );
  }

  return data;
}


/* =========================
   SAFE HTML
========================= */

function escapeHtml(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

/* =========================
   SCHOOL LOGIN
========================= */

async function schoolLogin() {

  try {

    const result = await supabase(
      "/auth/v1/token?grant_type=password",
      {
        method: "POST",

        body: JSON.stringify({
          email: document.getElementById("loginEmail").value,
          password: document.getElementById("loginPassword").value
        })
      }
    );

    accessToken = result.access_token;

    localStorage.setItem(
      "schoolpay_token",
      accessToken
    );

    showSchoolDashboard();

  } catch (error) {

    alert(
      "Login failed:\n\n" +
      error.message
    );
  }
}

async function registerSchool() {

  try {

    const account = await supabase(
      "/auth/v1/signup",
      {
        method: "POST",

        body: JSON.stringify({
          email:
            document.getElementById("schoolEmail").value,

          password:
            document.getElementById("schoolPassword").value
        })
      }
    );

    if (account.access_token) {

      accessToken =
        account.access_token;

      localStorage.setItem(
        "schoolpay_token",
        accessToken
      );
    }

    await supabase(
      "/rest/v1/rpc/register_school",
      {
        method: "POST",

        body: JSON.stringify({
          p_name:
            document.getElementById("schoolName").value,

          p_contact_name:
            document.getElementById("contactName").value,

          p_contact_phone:
            document.getElementById("schoolPhone").value,

          p_contact_email:
            document.getElementById("schoolEmail").value,

          p_logo_url:
            null
        })
      }
    );

    alert(
      "Your school registration has been submitted."
    );

    showLogin();

  } catch (error) {

    alert(
      "Registration failed:\n\n" +
      error.message
    );
  }
}

/* =========================
   ADD STUDENT
========================= */

async function addStudent() {

  const name =
    document.getElementById("studentName").value.trim();

  const studentId =
    document.getElementById("studentId").value.trim();

  const grade =
    document.getElementById("studentGrade").value;

  const tuition =
    Number(
      document.getElementById("studentTuition").value
    );

  if (!name) {
    alert("Please enter the student's name.");
    return;
  }

  if (!studentId) {
    alert("Please enter the student's ID.");
    return;
  }

  if (!grade) {
    alert("Please select the student's class.");
    return;
  }

  if (isNaN(tuition) || tuition < 0) {
    alert("Please enter a valid tuition amount.");
    return;
  }

  try {

    await supabase(
      "/rest/v1/rpc/add_student",
      {
        method: "POST",

        body: JSON.stringify({

          p_student_id:
            studentId,

          p_full_name:
            name,

          p_class_name:
            grade,

          p_tuition_amount:
            tuition
        })
      }
    );

    alert(
      "Student saved successfully."
    );

    showSchoolDashboard();

  } catch (error) {

    alert(
      "Could not save student:\n\n" +
      error.message
    );
  }
}

/* =========================
   CHECK BALANCE
========================= */

async function checkStudentBalance() {

  const studentId =
    document.getElementById(
      "paymentStudentId"
    ).value.trim();

  if (!studentId) {
    alert("Please enter a Student ID.");
    return;
  }

  try {

    const result =
      await supabase(
        "/rest/v1/rpc/get_student_payment_summary",
        {
          method: "POST",

          body: JSON.stringify({
            p_student_id:
              studentId
          })
        }
      );

    const student =
      Array.isArray(result)
        ? result[0]
        : result;

    if (!student) {
      throw new Error(
        "Student not found."
      );
    }

    document.getElementById(
      "studentBalance"
    ).innerHTML = `

      <div class="balance">

        <b>
          ${escapeHtml(student.student_name)}
        </b>

        <p>
          Tuition:
          <strong>
            L$${Number(student.tuition_amount || 0).toLocaleString()}
          </strong>
        </p>

        <p>
          Total Paid:
          <strong>
            L$${Number(student.total_paid || 0).toLocaleString()}
          </strong>
        </p>

        <p>
          Remaining Balance:
          <strong>
            L$${Number(student.remaining_balance || 0).toLocaleString()}
          </strong>
        </p>

      </div>
    `;

  } catch (error) {

    document.getElementById(
      "studentBalance"
    ).innerHTML = `

      <div class="rejected">
        ${escapeHtml(error.message)}
      </div>

    `;
  }
}


/* =========================
   RECORD PAYMENT
========================= */

async function recordPayment() {

  const studentId =
    document.getElementById(
      "paymentStudentId"
    ).value.trim();

  const amount =
    Number(
      document.getElementById(
        "paymentAmount"
      ).value
    );

  const method =
    document.getElementById(
      "paymentMethod"
    ).value;

  const notes =
    document.getElementById(
      "paymentNotes"
    ).value.trim();

  if (!studentId) {
    alert("Please enter the Student ID.");
    return;
  }

  if (!amount || amount <= 0) {
    alert("Please enter a valid payment amount.");
    return;
  }

  if (!method) {
    alert("Please select a payment method.");
    return;
  }

  try {

    const result =
      await supabase(
        "/rest/v1/rpc/record_student_payment",
        {
          method: "POST",

          body: JSON.stringify({

            p_student_id:
              studentId,

            p_amount:
              amount,

            p_payment_method:
              method,

            p_notes:
              notes || null

          })
        }
      );

    const receipt =
      Array.isArray(result)
        ? result[0]
        : result;

    if (!receipt) {
      throw new Error(
        "Payment was recorded but receipt information was not returned."
      );
    }

    alert(
      "Payment recorded successfully!"
    );

    printReceipt(receipt);

    showSchoolDashboard();

  } catch (error) {

    alert(
      "Could not record payment:\n\n" +
      error.message
    );
  }
}
