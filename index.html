/* =========================
   SUPABASE CONNECTION
========================= */

async function supabase(path, options = {}) {

  const headers = {
    "apikey": SUPABASE_KEY,
    "Content-Type": "application/json",
    ...(options.headers || {})
  };

  if (accessToken) {
    headers["Authorization"] =
      "Bearer " + accessToken;
  }

  const response =
    await fetch(
      SUPABASE_URL + path,
      {
        ...options,
        headers
      }
    );

  const text =
    await response.text();

  let data = null;

  try {
    data =
      text ? JSON.parse(text) : null;
  } catch {
    data = null;
  }

  if (!response.ok) {

    throw new Error(
      data?.message ||
      data?.msg ||
      data?.error_description ||
      text ||
      "Supabase request failed"
    );
  }

  return data;
}

async function getMySchool() {

    throw new Error(
      "No school account was found."
    );

  return schools[0];
}

async function schoolLogin() {

          body: JSON.stringify({
            email:
              document.getElementById(

            password:
              document.getElementById(
                "loginPassword"
              ).value

  } catch (error) {

    alert(
      "Login failed:\n\n" +
      error.message

}

/* =========================
   ADD STUDENT
========================= */

async function addStudent() {

  try {

    const name =
      document.getElementById(
        "studentName"
      ).value.trim();

    const id =
      document.getElementById(
        "studentId"
      ).value.trim();

    const grade =
      document.getElementById(
        "studentGrade"
      ).value;

    const tuition =
      Number(
        document.getElementById(
          "tuitionAmount"
        ).value
      );

    if (!name) {
      throw new Error(
        "Please enter the student's name."
      );
    }

    if (!id) {
      throw new Error(
        "Please enter the student's ID."
      );
    }

    if (!grade) {
      throw new Error(
        "Please select the student's class."
      );
    }

    if (!tuition || tuition < 0) {
      throw new Error(
        "Please enter a valid tuition amount."
      );
    }

    const school =
      await getMySchool();

    await supabase(
      "/rest/v1/students",
      {
        method: "POST",

        headers: {
          "Prefer": "return=minimal"
        },

        body: JSON.stringify({

          school_id:
            school.id,

          full_name:
            name,

          student_id:
            id,

          class_name:
            grade,

          tuition_amount:
            tuition
        })
      }
    );

    alert(
      "Student saved successfully."
    );

    showStudents();

  } catch (error) {

    alert(
      "Could not save student:\n\n" +
      error.message
    );
  }
}

    const students =
      await supabase(
        "/rest/v1/students?select=id,student_id,full_name,class_name,tuition_amount&order=created_at.desc"
      );

    if (!students.length) {

      list.innerHTML =
        "<p>No students registered yet.</p>";

      return;
    }

    list.innerHTML =
      students.map(student => `

        <div class="student-box">

          <strong>
            ${escapeHtml(student.full_name)}
          </strong>

          <br>

          Student ID:
          ${escapeHtml(student.student_id)}

          <br>

          Class:
          ${escapeHtml(student.class_name || "")}

          <br>

          Tuition:
          <strong>
            L${Number(
              student.tuition_amount
            ).toLocaleString()}

        </div>

      `).join("");

  } catch (error) {

    list.innerHTML =
      `<p class="error">
        Could not load students:
        ${escapeHtml(error.message)}
      </p>`;
  }
}

    );

  selectedStudent = null;

  if (!id) {
    box.innerHTML = "";
    return;
  }

  try {

    const students =
      await supabase(
        "/rest/v1/students?select=id,student_id,full_name,class_name,tuition_amount&student_id=eq." +
        encodeURIComponent(id) +
        "&limit=1"
      );

    if (!students.length) {

      box.innerHTML = `
        <div class="error">
          Student not found.
        </div>
      `;

      return;
    }

    selectedStudent =
      students[0];

    const payments =
      await supabase(
        "/rest/v1/payments?select=amount&student_id=eq." +
        encodeURIComponent(
          selectedStudent.id
        )
      );

    const paid =
      payments.reduce(
        (sum, payment) =>
          sum + Number(payment.amount || 0),

    const tuition =
      Number(
        selectedStudent.tuition_amount
      );

    const balance =
      Math.max(
        tuition - paid,
        0
      );

    box.innerHTML = `

      <div class="student-box">

        <strong>
          ${escapeHtml(
            selectedStudent.full_name
          )}
        </strong>

        <br>

        Class:
        ${escapeHtml(
          selectedStudent.class_name || ""

        <br>

        Tuition:
        L${tuition.toLocaleString()}

        Already Paid:
        L${paid.toLocaleString()}

        <br>

        <strong>
          Balance:
          L${balance.toLocaleString()}

      </div>
    `;

  } catch (error) {

    box.innerHTML = `
      <div class="error">
        ${escapeHtml(error.message)}
      </div>
    `;
  }
}

async function submitRenewal() {

  try {

    const amount =
      Number(
        document.getElementById(
          "renewAmount"
        ).value
      );

    const reference =
      document.getElementById(
        "renewReference"
      ).value.trim();

    if (!amount || amount <= 0) {
      throw new Error(
        "Please enter a valid renewal amount."
      );
    }

    if (!reference) {
      throw new Error(
        "Please enter the transaction reference."
      );
    }

    await supabase(
      "/rest/v1/rpc/submit_subscription_renewal",
      {
        method: "POST",

        body: JSON.stringify({

          p_amount:
            amount,

          p_transaction_reference:
            reference,

          p_notes:
            "SchoolPay renewal"
        })
      }
    );

    alert(
      "Renewal request submitted."
    );

    showSchoolDashboard();

  } catch (error) {

    alert(
      "Could not submit renewal:\n\n" +
      error.message
    );
  }
}

                "adminEmail"
              ).value,

            password:
              document.getElementById(
                "adminPassword"
              ).value
          })
        }
      );

    accessToken =
      result.access_token;

    localStorage.setItem(
      "schoolpay_token",
      accessToken
    );

    const owner =
      await supabase(
        "/rest/v1/rpc/is_owner",
        {
          method: "POST"
        }
      );

    if (!owner) {

      throw new Error(
        "This account is not an owner account."
      );
    }

    showAdminDashboard();

  } catch (error) {

    alert(
      "Admin login failed:\n\n" +
      error.message
    );
  }
}


/* =========================
   OWNER DASHBOARD
========================= */

async function showAdminDashboard() {

  app.innerHTML = `

    <h2>👑 Owner Dashboard</h2>

    <div class="card">

      <h3>
        Registered Schools
      </h3>

      <div id="adminSchools">
        Loading schools...
      </div>

    </div>

    <div class="card">

      <h3>
        📅 Subscription Renewal Requests
      </h3>

      <div id="adminRenewals">
        Loading subscription requests...
      </div>

    </div>

    <button
      class="secondary"
      onclick="logout()">
      Log out
    </button>
  `;

  await loadAdminSchools();
  await loadAdminRenewals();
}


/* =========================
   LOAD ALL SCHOOLS
========================= */

async function loadAdminSchools() {

  const container =
    document.getElementById(
      "adminSchools"
    );

  try {

    const schools =
      await supabase(
        "/rest/v1/schools?select=*&order=created_at.desc"
      );

    if (!schools.length) {

      container.innerHTML = `
        <div class="empty">
          No schools registered yet.
        </div>
      `;

      return;
    }

    container.innerHTML =
      schools.map(
        school => {

          const status =
            school.status ||
            "pending";

          const expires =
            school.subscription_expires_at
              ? new Date(
                  school.subscription_expires_at
                ).toLocaleDateString()
              : "Not set";

          return `

            <div class="school">

              <h3>
                ${escapeHtml(
                  school.name ||
                  "Unnamed School"
                )}
              </h3>

              <p>
                <strong>Contact:</strong>
                ${escapeHtml(
                  school.contact_name ||
                  "N/A"
                )}
              </p>

              <p>
                <strong>Phone:</strong>
                ${escapeHtml(
                  school.contact_phone ||
                  "N/A"
                )}
              </p>

              <p>
                <strong>Email:</strong>
                ${escapeHtml(
                  school.contact_email ||
                  "N/A"
                )}
              </p>

              <p>
                <strong>Status:</strong>
                ${statusBadge(status)}
              </p>

              <p>
                <strong>Subscription expires:</strong>
                ${escapeHtml(expires)}
              </p>

              <div class="school-actions">

                <button
                  class="danger-btn"
                  onclick="deleteSchool(
                    '${school.id}',
                    '${escapeJs(school.name || "this school")}'
                  )">

                  🗑️ Remove School

                </button>

              </div>

            </div>
          `;
        }
      ).join("");

  } catch (error) {

    container.innerHTML = `

      <p class="error">

        Could not load schools:
        ${escapeHtml(
          error.message
        )}

      </p>
    `;
  }
}


/* =========================
   LOAD SUBSCRIPTION REQUESTS
========================= */

async function loadAdminRenewals() {

  const container =
    document.getElementById(
      "adminRenewals"
    );

  try {

    const renewals =
      await supabase(
        "/rest/v1/subscription_renewals?select=*,schools(name,contact_name,contact_phone,contact_email)&order=submitted_at.desc"
      );

    if (!renewals.length) {

      container.innerHTML = `
        <div class="empty">
          No subscription renewal requests yet.
        </div>
      `;

      return;
    }

    container.innerHTML =
      renewals.map(
        renewal => {

          const school =
            renewal.schools || {};

          const status =
            renewal.status ||
            "pending";

          const submitted =
            renewal.submitted_at
              ? new Date(
                  renewal.submitted_at
                ).toLocaleString()
              : "N/A";

          const reviewed =
            renewal.reviewed_at
              ? new Date(
                  renewal.reviewed_at
                ).toLocaleString()
              : "";

          return `

            <div class="renewal">

              <h3>
                ${escapeHtml(
                  school.name ||
                  "Unknown School"
                )}
              </h3>

              <p>
                <strong>
                  Amount:
                </strong>

                L${Number(
                  renewal.amount || 0
                ).toLocaleString()}
              </p>

              <p>
                <strong>
                  Transaction Reference:
                </strong>

                ${escapeHtml(
                  renewal.transaction_reference ||
                  "N/A"
                )}
              </p>

              <p>
                <strong>
                  Submitted:
                </strong>

                ${escapeHtml(
                  submitted
                )}
              </p>

              <p>
                <strong>
                  Status:
                </strong>

                ${statusBadge(status)}
              </p>

              ${
                reviewed
                  ? `
                    <p>
                      <strong>
                        Reviewed:
                      </strong>

                      ${escapeHtml(
                        reviewed
                      )}
                    </p>
                  `
                  : ""
              }

              ${
                status === "pending"
                  ? `

                    <div class="renewal-actions">

                      <button
                        class="success-btn"
                        onclick="approveRenewal(
                          '${renewal.id}',
                          '${renewal.school_id}'
                        )">

                        ✓ Approve

                      </button>

                      <button
                        class="danger-btn"
                        onclick="rejectRenewal(
                          '${renewal.id}'
                        )">

                        ✕ Reject

                      </button>

                    </div>

                  `
                  : ""
              }

            </div>
          `;
        }
      ).join("");

  } catch (error) {

    container.innerHTML = `

      <p class="error">

        Could not load subscription requests:

        ${escapeHtml(
          error.message
        )}

      </p>
    `;
  }
}


/* =========================
   STATUS BADGE
========================= */

function statusBadge(status) {

  const value =
    String(
      status ||
      "pending"
    ).toLowerCase();

  let className =
    "badge-pending";

  if (
    value === "approved" ||
    value === "active"
  ) {
    className =
      "badge-approved";
  }

  if (
    value === "rejected" ||
    value === "expired"
  ) {
    className =
      "badge-rejected";
  }

  if (
    value === "suspended"
  ) {
    className =
      "badge-suspended";
  }

  return `
    <span class="badge ${className}">
      ${escapeHtml(
        value.toUpperCase()
      )}
    </span>
  `;
}


/* =========================
   APPROVE RENEWAL
========================= */

async function approveRenewal(
  renewalId,
  schoolId
) {

  const confirmed =
    confirm(
      "Approve this subscription renewal?\n\n" +
      "The school will receive another 6 months of access."
    );

  if (!confirmed) {
    return;
  }

  try {

    /*
      Get the renewal first.
    */

    const renewals =
      await supabase(
        "/rest/v1/subscription_renewals?id=eq." +
        encodeURIComponent(
          renewalId
        ) +
        "&select=*"
      );

    if (!renewals.length) {

      throw new Error(
        "Renewal request was not found."
      );
    }

    const renewal =
      renewals[0];

    if (
      renewal.status !==
      "pending"
    ) {

      throw new Error(
        "This renewal has already been reviewed."
      );
    }

    /*
      Mark renewal as approved.
    */

    await supabase(
      "/rest/v1/subscription_renewals?id=eq." +
      encodeURIComponent(
        renewalId
      ),
      {
        method: "PATCH",

        headers: {
          "Prefer":
            "return=minimal"
        },

        body: JSON.stringify({

          status:
            "approved",

          reviewed_by:
            null,

          reviewed_at:
            new Date().toISOString(),

          notes:
            "Approved by SchoolPay owner"
        })
      }
    );

    /*
      Get current school subscription.
    */

    const schools =
      await supabase(
        "/rest/v1/schools?id=eq." +
        encodeURIComponent(
          schoolId
        ) +
        "&select=id,subscription_expires_at,status"
      );

    if (!schools.length) {

      throw new Error(
        "School was not found."
      );
    }

    const school =
      schools[0];

    /*
      Give the school 6 months.

      If the current subscription
      is still active, extend from
      the existing expiry date.

      Otherwise start from today.
    */

    const now =
      new Date();

    let startDate =
      now;

    if (
      school.subscription_expires_at
    ) {

      const existingExpiry =
        new Date(
          school.subscription_expires_at
        );

      if (
        existingExpiry > now
      ) {
        startDate =
          existingExpiry;
      }
    }

    const newExpiry =
      new Date(
        startDate
      );

    newExpiry.setMonth(
      newExpiry.getMonth() + 6
    );

    /*
      Activate the school.
    */

    await supabase(
      "/rest/v1/schools?id=eq." +
      encodeURIComponent(
        schoolId
      ),
      {
        method: "PATCH",

        headers: {
          "Prefer":
            "return=minimal"
        },

        body: JSON.stringify({

          status:
            "active",

          subscription_started_at:
            startDate.toISOString(),

          subscription_expires_at:
            newExpiry.toISOString(),

          updated_at:
            new Date().toISOString()
        })
      }
    );

    alert(
      "Subscription approved successfully.\n\n" +
      "New expiry date: " +
      newExpiry.toLocaleDateString()
    );

    await showAdminDashboard();

  } catch (error) {

    alert(
      "Could not approve renewal:\n\n" +
      error.message
    );

    await showAdminDashboard();
  }
}


/* =========================
   REJECT RENEWAL
========================= */

async function rejectRenewal(
  renewalId
) {

  const reason =
    prompt(
      "Why are you rejecting this renewal?\n\n" +
      "You can leave it blank."
    );

  if (
    reason === null
  ) {
    return;
  }

  try {

    const renewals =
      await supabase(
        "/rest/v1/subscription_renewals?id=eq." +
        encodeURIComponent(
          renewalId
        ) +
        "&select=id,status"
      );

    if (!renewals.length) {

      throw new Error(
        "Renewal request was not found."
      );
    }

    if (
      renewals[0].status !==
      "pending"
    ) {

      throw new Error(
        "This renewal has already been reviewed."
      );
    }

    await supabase(
      "/rest/v1/subscription_renewals?id=eq." +
      encodeURIComponent(
        renewalId
      ),
      {
        method: "PATCH",

        headers: {
          "Prefer":
            "return=minimal"
        },

        body: JSON.stringify({

          status:
            "rejected",

          reviewed_by:
            null,

          reviewed_at:
            new Date().toISOString(),

          notes:
            reason.trim() ||
            "Renewal rejected by SchoolPay owner"
        })
      }
    );

    alert(
      "Subscription renewal rejected."
    );

    await showAdminDashboard();

  } catch (error) {

    alert(
      "Could not reject renewal:\n\n" +
      error.message
    );

    await showAdminDashboard();
  }
}


/* =========================
   DELETE SCHOOL
========================= */

async function deleteSchool(
  schoolId,
  schoolName
) {

  const confirmed =
    confirm(
      "⚠️ REMOVE SCHOOL\n\n" +
      "Are you sure you want to permanently remove:\n\n" +
      schoolName +
      "\n\n" +
      "This will also remove the school's students, payments and subscription renewal records.\n\n" +
      "This action cannot be undone."
    );

  if (!confirmed) {
    return;
  }

  /*
    Second confirmation prevents
    accidental deletion.
  */

  const finalConfirmation =
    prompt(
      "Type DELETE to permanently remove this school:"
    );

  if (
    finalConfirmation !==
    "DELETE"
  ) {

    alert(
      "School was NOT removed."
    );

    return;
  }

  try {

    /*
      The schools table has CASCADE
      relationships for students,
      payments and subscription
      renewals, so deleting the
      school removes those records
      automatically.
    */

    await supabase(
      "/rest/v1/schools?id=eq." +
      encodeURIComponent(
        schoolId
      ),
      {
        method: "DELETE",

        headers: {
          "Prefer":
            "return=minimal"
        }
      }
    );

    alert(
      schoolName +
      " has been removed successfully."
    );

    await showAdminDashboard();

  } catch (error) {

    alert(
      "Could not remove school:\n\n" +
      error.message
    );

    await showAdminDashboard();
  }
}


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value) {

  if (
    value === null ||
    value === undefined
  ) {
    return "";
  }

  return String(value)
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );
}


/* =========================
   ESCAPE JAVASCRIPT
========================= */

function escapeJs(value) {

  return String(
    value || ""
  )
    .replaceAll(
      "\\",
      "\\\\"
    )
    .replaceAll(
      "'",
      "\\'"
    )
    .replaceAll(
      "\n",
      "\\n"
    )
    .replaceAll(
      "\r",
      "\\r"
    );
}


/* =========================
   LOGOUT
========================= */

function logout() {

  accessToken = "";

  localStorage.removeItem(
    "schoolpay_token"
  );

  showLogin();
}


/* =========================
   START APP
========================= */

showLogin();
