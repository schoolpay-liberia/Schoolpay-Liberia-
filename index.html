/* =========================
   SUPABASE CONNECTION
========================= */

async function supabase(path, options = {}) {

  const headers = {
    "apikey": SUPABASE_KEY,
    "Content-Type": "application/json",
    ...(options.headers || {})
  };

  if (accessToken) {
    headers["Authorization"] =
      "Bearer " + accessToken;
  }

  const response = await fetch(
    SUPABASE_URL + path,
    {
      ...options,
      headers
    }
  );

  const text =
    await response.text();

  let data = null;

  try {
    data =
      text ? JSON.parse(text) : null;
  } catch {
    data = null;
  }

  if (!response.ok) {

    throw new Error(
      data?.message ||
      data?.msg ||
      data?.error_description ||
      text ||
      "Supabase request failed"
    );
  }

  return data;
}

      "No school account was found."

  return schools[0];
}

async function schoolLogin() {

  try {

    const result =
      await supabase(
        "/auth/v1/token?grant_type=password",

          body: JSON.stringify({
            email:
              document.getElementById("loginEmail").value,

            password:

  } catch (error) {

    alert(

async function addStudent() {

  try {

    const name =
      document.getElementById(
        "studentName"
      ).value.trim();

    const id =
      document.getElementById(
        "studentId"
      ).value.trim();

    const grade =
      document.getElementById(

        ).value
      );

    if (!name) {
      throw new Error(
        "Please enter the student's name."
      );
    }

    if (!id) {
      throw new Error(
        "Please enter the student's ID."
      );
    }

    if (!grade) {
      throw new Error(
        "Please select the student's class."
      );
    }

    if (!tuition || tuition < 0) {
      throw new Error(
        "Please enter a valid tuition amount."
      );
    }

    const school =
      await getMySchool();

    await supabase(
      "/rest/v1/students",
      {
        method: "POST",

        headers: {
          "Prefer": "return=minimal"
        },

        body: JSON.stringify({

          school_id:
            school.id,

          full_name:
            name,

          student_id:
            id,

          class_name:
            grade,

          tuition_amount:
            tuition

    );

    alert(
      "Student saved successfully."

    showStudents();

  } catch (error) {

    alert(

      error.message
    );
  }
}

/* =========================
   FIND STUDENT
========================= */

let selectedStudent = null;

async function findStudentForPayment() {

  const id =
    document.getElementById(
      "paymentStudentId"
    ).value.trim();

  const box =
    document.getElementById(
      "paymentStudentInfo"
    );

  selectedStudent = null;

  if (!id) {
    box.innerHTML = "";
    return;
  }

  try {

    const students =
      await supabase(
        "/rest/v1/students?select=id,student_id,full_name,class_name,tuition_amount&student_id=eq." +
        encodeURIComponent(id) +
        "&limit=1"
      );

    if (!students.length) {

      box.innerHTML = `
        <div class="error">
          Student not found.
        </div>
      `;

      return;
    }

    selectedStudent =
      students[0];

    const payments =
      await supabase(
        "/rest/v1/payments?select=amount&student_id=eq." +
        encodeURIComponent(
          selectedStudent.id
        )
      );

    const paid =
      payments.reduce(
        (sum, payment) =>
          sum + Number(payment.amount || 0),
        0
      );

    const tuition =
      Number(
        selectedStudent.tuition_amount
      );

    const balance =
      Math.max(
        tuition - paid,
        0
      );

    box.innerHTML = `

      <div class="student-box">

        <strong>
          ${escapeHtml(
            selectedStudent.full_name
          )}
        </strong>

        <br>

        Class:
        ${escapeHtml(
          selectedStudent.class_name || ""
        )}

        <br>

        Tuition:
        L${tuition.toLocaleString()}

        <br>

        Already Paid:
        L${paid.toLocaleString()}

        <br>

        <strong>
          Balance:
          L${balance.toLocaleString()}
        </strong>

      </div>
    `;

  } catch (error) {

    box.innerHTML = `
      <div class="error">
        ${escapeHtml(error.message)}
      </div>
    `;
  }
}
  /* =========================
   RECORD PAYMENT
========================= */

async function recordPayment() {

  try {

    const studentId =
      document.getElementById(
        "paymentStudentId"
      ).value.trim();

    const amount =
      Number(
        document.getElementById(
          "paymentAmount"
        ).value
      );

    const method =
      document.getElementById(
        "paymentMethod"
      ).value;

    const reference =
      document.getElementById(
        "paymentReference"
      ).value.trim();

    const notes =
      document.getElementById(
        "paymentNotes"
      ).value.trim();

    if (!studentId) {
      throw new Error(
        "Please enter a Student ID."
      );
    }

    if (!selectedStudent) {

      const students =
        await supabase(
          "/rest/v1/students?select=id,student_id,full_name,class_name,tuition_amount&student_id=eq." +
          encodeURIComponent(studentId) +
          "&limit=1"
        );

      if (!students.length) {
        throw new Error(
          "Student was not found."
        );
      }

      selectedStudent =
        students[0];
    }

    if (!amount || amount <= 0) {
      throw new Error(
        "Please enter a valid payment amount."
      );
    }

    if (!method) {
      throw new Error(
        "Please select a payment method."
      );
    }

    const school =
      await getMySchool();

    /*
      Generate a unique receipt number.
    */

    const receiptNumber =
      generateReceiptNumber();

    /*
      Save the payment in Supabase.
    */

    const payment =
      await supabase(
        "/rest/v1/payments",
        {
          method: "POST",

          headers: {
            "Prefer":
              "return=representation"
          },

          body: JSON.stringify({

            school_id:
              school.id,

            student_id:
              selectedStudent.id,

            amount:
              amount,

            payment_method:
              method,

            receipt_number:
              receiptNumber,

            paid_at:
              new Date().toISOString(),

            entered_by:
              null,

            notes:
              notes ||
              reference ||
              null
          })
        }
      );

    /*
      Show the receipt using
      the saved payment.
    */

    const savedPayment =
      Array.isArray(payment)
        ? payment[0]
        : payment;

    await showReceipt(
      school,
      selectedStudent,
      savedPayment,
      reference
    );

  } catch (error) {

    alert(
      "Could not record payment:\n\n" +
      error.message
    );
  }
}


/* =========================
   RECEIPT NUMBER
========================= */

function generateReceiptNumber() {

  const now =
    new Date();

  const year =
    now.getFullYear();

  const month =
    String(
      now.getMonth() + 1
    ).padStart(2, "0");

  const day =
    String(
      now.getDate()
    ).padStart(2, "0");

  const random =
    Math.floor(
      100000 +
      Math.random() * 900000
    );

  return (
    "SPL-" +
    year +
    month +
    day +
    "-" +
    random
  );
}

      return;
    }

    document.getElementById(
      "paymentHistory"
    ).innerHTML =

      payments.map(payment => `

        <div class="student-box">

          <strong>
            Receipt:
            ${escapeHtml(
              payment.receipt_number
            )}
          </strong>

          <br>

          Amount:
          L${Number(
            payment.amount
          ).toLocaleString()}

          <br>

          Method:
          ${escapeHtml(
            payment.payment_method
          )}

          <br>

          Date:
          ${new Date(
            payment.paid_at
          ).toLocaleString()}

        </div>

      `).join("");

  } catch (error) {

    document.getElementById(
      "paymentHistory"
    ).innerHTML = `

      <p class="error">

        Could not load payments:
        ${escapeHtml(
          error.message
        )}

      </p>
    `;
  }
}


/* =========================
   SUBSCRIPTION
========================= */

function showRenewal() {

  app.innerHTML = `

    <div class="card">

      <h2>Subscription Renewal</h2>

      <p>
        Submit your renewal request
        for owner approval.
      </p>

      <input
        id="renewAmount"
        type="number"
        placeholder="Amount (L$)"
      >

      <input
        id="renewReference"
        placeholder="Transaction reference"
      >

      <button onclick="submitRenewal()">
        Submit Renewal
      </button>

      <button
        class="secondary"
        onclick="showSchoolDashboard()">

        Back

      </button>

    </div>
  `;
}


async function submitRenewal() {

  try {

    await supabase(
      "/rest/v1/rpc/submit_subscription_renewal",
      {
        method: "POST",

        body: JSON.stringify({

          p_amount:
            document.getElementById(
              "renewAmount"
            ).value,

          p_transaction_reference:
            document.getElementById(
              "renewReference"
            ).value,

          p_notes:
            "SchoolPay renewal"
        })
      }
    );

    alert(
      "Renewal request submitted."
    );

    showSchoolDashboard();

  } catch (error) {

    alert(
      "Could not submit renewal:\n\n" +
      error.message
    );
  }
}


/* =========================
   OWNER / ADMIN LOGIN
========================= */

function showAdminLogin() {

  app.innerHTML = `

    <div class="card">

      <h2>Owner / Admin</h2>

      <input
        id="adminEmail"
        type="email"
        placeholder="Admin email"
      >

      <input
        id="adminPassword"
        type="password"
        placeholder="Admin password"
      >

      <button onclick="adminLogin()">
        Sign In
      </button>

      <button
        class="secondary"
        onclick="showLogin()">

        Back

      </button>

    </div>
  `;
}


async function adminLogin() {

  try {

    const result =
      await supabase(
        "/auth/v1/token?grant_type=password",
        {
          method: "POST",

          body: JSON.stringify({

            email:
              document.getElementById(
                "adminEmail"
              ).value,

            password:
              document.getElementById(
                "adminPassword"
              ).value
          })
        }
      );

    accessToken =
      result.access_token;

    localStorage.setItem(
      "schoolpay_token",
      accessToken
    );

    const owner =
      await supabase(
        "/rest/v1/rpc/is_owner",
        {
          method: "POST"
        }
      );

    if (!owner) {

      throw new Error(
        "This account is not an owner account."
      );
    }

    showAdminDashboard();

  } catch (error) {

    alert(
      "Admin login failed:\n\n" +
      error.message
    );
  }
}


/* ===/* =========================
   OWNER DASHBOARD
========================= */

async function showAdminDashboard() {

  try {

    const schools = await supabase(
      "/rest/v1/schools?select=*&order=created_at.desc"
    );

    let schoolList = "";

    if (!schools || schools.length === 0) {

      schoolList =
        "<p>No schools registered yet.</p>";

    } else {

      schools.forEach(function(school) {

        schoolList += `

          <div class="school">

            <b>
              ${school.name || "School"}
            </b>

            <br><br>

            Status:
            <b>${school.status || "Pending"}</b>

            <br><br>

            <button
              onclick="removeSchool('${school.id}', '${String(school.name || "School").replace(/'/g, "\\'")}')"
              style="background:#dc3545;">
              🗑️ Remove School
            </button>

          </div>

        `;
      });
    }


    /* =========================
       LOAD SUBSCRIPTIONS
    ========================= */

    let renewalList = "";

    try {

      const renewals = await supabase(
        "/rest/v1/rpc/owner_list_subscription_renewals",
        {
          method: "POST"
        }
      );

      if (!renewals || renewals.length === 0) {

        renewalList =
          "<p>No subscription requests found.</p>";

      } else {

        renewals.forEach(function(renewal) {

          renewalList += `

            <div class="school">

              <h4>
                🏫 ${renewal.school_name || "School"}
              </h4>

              <p>
                <b>Amount:</b>
                L$${renewal.amount || 0}
              </p>

              <p>
                <b>Transaction Reference:</b>
                ${renewal.transaction_reference || "None"}
              </p>

              <p>
                <b>Status:</b>
                ${renewal.status || "Pending"}
              </p>

              <p>
                <b>Submitted:</b>
                ${renewal.submitted_at
                  ? new Date(renewal.submitted_at).toLocaleString()
                  : "Unknown"}
              </p>

              ${
                String(renewal.status).toLowerCase() === "pending"
                ? `

                  <button
                    onclick="approveRenewal('${renewal.id}')"
                    style="background:#198754;">
                    ✅ Approve
                  </button>

                  <button
                    onclick="rejectRenewal('${renewal.id}')"
                    style="background:#dc3545;">
                    ❌ Reject
                  </button>

                `
                : ""
              }

            </div>

          `;
        });
      }

    } catch (renewalError) {

      renewalList = `
        <p style="color:#b00020;">
          Could not load subscription requests:
          ${renewalError.message}
        </p>
      `;
    }


    /* =========================
       OWNER DASHBOARD HTML
    ========================= */

    app.innerHTML = `

      <h2>👑 Owner Dashboard</h2>


      <div class="card">

        <h3>🏫 Registered Schools</h3>

        ${schoolList}

      </div>


      <div class="card">

        <h3>📅 Subscription Requests</h3>

        <p>
          Review school subscription payments
          and approve or reject them.
        </p>

        ${renewalList}

      </div>


      <button
        class="secondary"
        onclick="showAdminDashboard()">
        🔄 Refresh Dashboard
      </button>


      <button
        class="secondary"
        onclick="logout()">
        Log out
      </button>

    `;

  } catch (error) {

    alert(
      "Could not load Admin Dashboard:\n\n" +
      error.message
    );

  }
}


/* =========================
   APPROVE SUBSCRIPTION
========================= */

async function approveRenewal(renewalId) {

  if (!confirm(
    "Are you sure you want to approve this subscription?"
  )) {
    return;
  }

  try {

    await supabase(
      "/rest/v1/rpc/approve_subscription_renewal",
      {
        method: "POST",

        body: JSON.stringify({
          p_renewal_id: renewalId
        })
      }
    );

    alert(
      "Subscription approved successfully."
    );

    showAdminDashboard();

  } catch (error) {

    alert(
      "Could not approve subscription:\n\n" +
      error.message
    );

  }
}


/* =========================
   REJECT SUBSCRIPTION
========================= */

async function rejectRenewal(renewalId) {

  if (!confirm(
    "Are you sure you want to reject this subscription?"
  )) {
    return;
  }

  try {

    await supabase(
      "/rest/v1/rpc/reject_subscription_renewal",
      {
        method: "POST",

        body: JSON.stringify({
          p_renewal_id: renewalId
        })
      }
    );

    alert(
      "Subscription rejected."
    );

    showAdminDashboard();

  } catch (error) {

    alert(
      "Could not reject subscription:\n\n" +
      error.message
    );

  }
}


/* =========================
   REMOVE SCHOOL
========================= */

async function removeSchool(
  schoolId,
  schoolName
) {

  if (!confirm(
    "WARNING!\n\n" +
    "You are about to remove:\n\n" +
    schoolName +
    "\n\n" +
    "This will remove the school's " +
    "students, payments and subscription records.\n\n" +
    "Continue?"
  )) {
    return;
  }

  try {

    await supabase(
      "/rest/v1/rpc/owner_delete_school",
      {
        method: "POST",

        body: JSON.stringify({
          p_school_id: schoolId
        })
      }
    );

    alert(
      schoolName +
      " has been removed successfully."
    );

    showAdminDashboard();

  } catch (error) {

    alert(
      "Could not remove school:\n\n" +
      error.message
    );

  }
}      unction ction logout() {

  accessToken = "";

  localStorage.removeItem(
    "schoolpay_token"
  );

  showLogin();
}


/* =========================
   START APP
========================= */

showLogin();

</script>
