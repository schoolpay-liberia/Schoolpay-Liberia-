/* =========================
   SUPABASE CONNECTION
========================= */

async function supabase(path, options = {}) {

  const headers = {
    "apikey": SUPABASE_KEY,
    "Content-Type": "application/json",
    ...(options.headers || {})
  };

  if (accessToken) {
    headers["Authorization"] =
      "Bearer " + accessToken;
  }

  const response = await fetch(
    SUPABASE_URL + path,
    {
      ...options,
      headers
    }
  );

  const text = await response.text();

  let data = null;

  try {
    data = text ? JSON.parse(text) : null;
  } catch {
    data = null;
  }

  if (!response.ok) {

    throw new Error(
      data?.message ||
      data?.msg ||
      data?.error_description ||
      text ||
      "Supabase request failed"
    );
  }

  return data;
}

   LOGIN
========================= */

/* =========================
   SCHOOL LOGIN
========================= */

async function schoolLogin() {

  try {

    const result = await supabase(
      "/auth/v1/token?grant_type=password",
      {
        method: "POST",

        body: JSON.stringify({
          email: loginEmail.value.trim(),

/* =========================
   SCHOOL REGISTRATION
========================= */

function showRegistration() {

  app.innerHTML = `

    <div class="card">

      <h2>Register Your School</h2>

      <p class="small">
        Submit your school information for owner approval.
      </p>

      <input
        id="schoolName"
        placeholder="School name"
      >

      <input
        id="contactName"
        placeholder="Contact person's name"
      >

      <input
        id="schoolPhone"
        placeholder="Phone number"
      >

      <input
        id="schoolEmail"
        type="email"
        placeholder="Email"
      >

      <input
        id="schoolPassword"
        type="password"
        placeholder="Password"
      >

      <button onclick="registerSchool()">
        Submit Registration
      </button>

      <button
        class="secondary"
        onclick="showLogin()">
        Back
      </button>

    </div>
  `;
}


async function registerSchool() {

  try {

    if (!schoolName.value.trim()) {
      alert("Please enter the school name.");
      return;
    }

    if (!schoolEmail.value.trim()) {
      alert("Please enter an email.");
      return;
    }

    if (schoolPassword.value.length < 6) {
      alert("Password must be at least 6 characters.");
      return;
    }

    const account = await supabase(
      "/auth/v1/signup",
      {
        method: "POST",

        body: JSON.stringify({
          email: schoolEmail.value.trim(),
          password: schoolPassword.value
        })
      }
    );

    if (account.access_token) {

      accessToken =
        account.access_token;

      localStorage.setItem(
        "schoolpay_token",
        accessToken
      );
    }

    await supabase(
      "/rest/v1/rpc/register_school",
      {
        method: "POST",

        body: JSON.stringify({
          p_name: schoolName.value.trim(),
          p_contact_name: contactName.value.trim(),
          p_contact_phone: schoolPhone.value.trim(),
          p_contact_email: schoolEmail.value.trim(),
          p_logo_url: null
        })
      }
    );

    alert(
      "Registration submitted successfully!\n\n" +
      "Your school is now waiting for owner approval."
    );

    showLogin();

  } catch (error) {

    alert(
      "Registration failed:\n\n" +
      error.message
    );
  }
}

async function showSchoolDashboard() {

  app.innerHTML = `

        Students

      <div class="success">
        ✓ School account connected
      </div>

      <button onclick="showStudents()">
        👨‍🎓 Students
      </button>

      <button onclick="showPayments()">
        💰 Payments
      </button>

      <button onclick="showRenewal()">
        📅 Subscription / Renewal
      </button>

    </div>

    <button
      class="secondary"
      onclick="logout()">
      Log out
    </button>
  `;

  try {

    const students =
      await supabase(
        "/rest/v1/students?select=id"
      );

    document.getElementById(
      "studentCount"
    ).textContent = students.length;

  } catch {

    document.getElementById(
      "studentCount"
    ).textContent = "0";
  }

  try {

    const profiles =
      await supabase(
        "/rest/v1/profiles?select=school_id&limit=1"
      );

    if (profiles && profiles.length) {

      const schools =
        await supabase(
          "/rest/v1/schools?id=eq." +
          profiles[0].school_id +
          "&select=status"
        );

      if (schools.length) {

        document.getElementById(
          "schoolStatus"
        ).textContent =
          schools[0].status;
      }
    }

  } catch {

    document.getElementById(
      "schoolStatus"
    ).textContent = "Active";
  }
}

async function addStudent() {

  try {

    await supabase(
      "/rest/v1/students",
      {
        method: "POST",

        headers: {
          "Prefer": "return=minimal"
        },

        body: JSON.stringify({

          full_name:
            studentName.value.trim(),

          student_id:
            studentId.value.trim(),

          class_name:
            studentClass.value.trim(),

          tuition_amount:
            Number(tuitionAmount.value || 0)

        })
      }
    );

    alert(
      "Student saved successfully."
    );

    showSchoolDashboard();

  } catch (error) {

    alert(
      "Could not save student:\n\n" +
      error.message
    );
  }
}

async function recordPayment() {

  try {

    if (!paymentStudentId.value.trim()) {
      alert("Please enter the student's UUID.");
      return;
    }

    if (!paymentAmount.value || Number(paymentAmount.value) <= 0) {
      alert("Please enter a valid payment amount.");
      return;
    }

    if (!paymentMethod.value) {
      alert("Please select a payment method.");
      return;
    }

    await supabase(
      "/rest/v1/payments",
      {
        method: "POST",

        headers: {
          "Prefer": "return=minimal"
        },

        body: JSON.stringify({

          student_id:
            paymentStudentId.value.trim(),

          amount:
            Number(paymentAmount.value),

          payment_method:
            paymentMethod.value,

          receipt_number:
            receiptNumber.value.trim(),

          notes:
            paymentNotes.value.trim(),

          entered_by:
            null

        })
      }
    );

    alert(
      "Payment recorded successfully."
    );

    showSchoolDashboard();

  } catch (error) {

    alert(
      "Could not record payment:\n\n" +
      error.message
    );
  }
}

/* =========================
   OWNER DASHBOARD
========================= */

async function showAdminDashboard() {

  try {

    const schools =
      await supabase(
        "/rest/v1/schools?select=*&order=created_at.desc"
      );

    let schoolList = "";

    if (!schools || schools.length === 0) {

      schoolList =
        "<p>No schools registered yet.</p>";

    } else {

      schools.forEach(function(school) {

        let statusBox = "";

        if (school.status === "pending") {

          statusBox = `

            <div class="pending">

              <strong>🟡 Pending Approval</strong>

              <button
                class="successBtn"
                onclick="approveSchool('${school.id}')">
                ✅ Approve School
              </button>

              <button
                class="danger"
                onclick="rejectSchool('${school.id}')">
                ❌ Reject School
              </button>

            </div>

          `;

        } else if (school.status === "active") {

          statusBox = `

            <div class="success">

              <strong>🟢 Active School</strong>

              <p>
                Subscription expires:
                ${
                  school.subscription_expires_at
                  ? new Date(
                      school.subscription_expires_at
                    ).toLocaleDateString()
                  : "Not set"
                }
              </p>

            </div>

          `;

        } else if (school.status === "rejected") {

          statusBox = `

            <div class="rejected">

              <strong>
                🔴 Registration Rejected
              </strong>

            </div>

          `;

        } else if (school.status === "suspended") {

          statusBox = `

            <div class="rejected">

              <strong>
                ⛔ School Suspended
              </strong>

            </div>

          `;

        } else if (school.status === "expired") {

          statusBox = `

            <div class="pending">

              <strong>
                ⚠️ Subscription Expired
              </strong>

            </div>

          `;
        }

        schoolList += `

          <div class="school">

            <h3>
              ${school.name || "School"}
            </h3>

            <p>
              <strong>Contact:</strong>
              ${school.contact_name || "—"}
            </p>

            <p>
              <strong>Phone:</strong>
              ${school.contact_phone || "—"}
            </p>

            <p>
              <strong>Email:</strong>
              ${school.contact_email || "—"}
            </p>

            <p>
              <strong>Status:</strong>
              ${school.status || "pending"}
            </p>

            ${statusBox}

          </div>

        `;
      });
    }

    app.innerHTML = `

      <h2>👑 Owner Dashboard</h2>

      <div class="card">

        <h3>🏫 Registered Schools</h3>

        ${schoolList}

      </div>

      <div class="card">

        <h3>📅 Subscriptions</h3>

        <p>
          Approving a school automatically
          starts its 6-month subscription.
        </p>

      </div>

      <button
        class="secondary"
        onclick="logout()">
        Log out
      </button>

    `;

  } catch (error) {

    alert(
      "Could not load Admin Dashboard:\n\n" +
      error.message
    );
  }
}


/* =========================
   APPROVE SCHOOL
========================= */

    "Approve this school?\n\n" +

    "its 6-month subscription will begin."

  if (!confirmed) {
    return;
  }

  try {

    await supabase(
      "/rest/v1/rpc/approve_school",
      {
        method: "POST",

        body: JSON.stringify({
          p_school_id: schoolId
        })
      }
    );

    alert(
      "School approved successfully! ✅\n\n" +
      "The 6-month subscription has started."
    );

    showAdminDashboard();

  } catch (error) {

    alert(
      "Could not approve school:\n\n" +
      error.message
    );
  }
}
