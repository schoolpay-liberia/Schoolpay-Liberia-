/* =========================
   SUPABASE CONNECTION
========================= */

async function supabase(path, options = {}) {

  const headers = {
    "apikey": SUPABASE_KEY,
    "Content-Type": "application/json",
    ...(options.headers || {})
  };

  if (accessToken) {
    headers["Authorization"] =
      "Bearer " + accessToken;
  }

  const response = await fetch(
    SUPABASE_URL + path,
    {
      ...options,
      headers
    }
  );

  const text = await response.text();

  let data = null;

  try {
    data = text ? JSON.parse(text) : null;
  } catch {
    data = null;
  }

  if (!response.ok) {
    throw new Error(
      data?.message ||
      data?.msg ||
      data?.error_description ||
      text ||
      "Supabase request failed"
    );
  }

  return data;
}


/* =========================
   HELPERS
========================= */

function escapeHtml(value) {

  if (value === null || value === undefined) {
    return "";
  }

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}


function escapeJs(value) {

  if (value === null || value === undefined) {
    return "";
  }

  return String(value)
    .replaceAll("\\", "\\\\")
    .replaceAll("'", "\\'")
    .replaceAll('"', '\\"')
    .replaceAll("\n", "\\n")
    .replaceAll("\r", "\\r");
}


function generateReceiptNumber() {

  const now = new Date();

  return "SPL-" +
    now.getFullYear() +
    String(now.getMonth() + 1).padStart(2, "0") +
    String(now.getDate()).padStart(2, "0") +
    "-" +
    Math.floor(100000 + Math.random() * 900000);
}

                    "this school"
                  )}'
                )">

                ✓ Approve

              </button>

              <button
                class="danger-btn small-btn"
                onclick="rejectSchool(
                  '${escapeJs(school.id)}',
                  '${escapeJs(
                    school.name ||
                    "this school"
                  )}'
                )">

                ✕ Reject

              </button>

            </div>
          `;
        }

        return `

          <div class="school">

            <b>
              ${escapeHtml(
                school.name ||
                "School"
              )}
            </b>

            <br>

            Contact:
            ${escapeHtml(
              school.contact_name ||
              school.contact_person ||
              "N/A"
            )}

            <br>

            Phone:
            ${escapeHtml(
              school.contact_phone ||
              school.phone ||
              "N/A"
            )}

            <br>

            Email:
            ${escapeHtml(
              school.contact_email ||
              school.email ||
              "N/A"
            )}

            <br>

            Status:

            <span
              class="status ${statusClass}">

              ${escapeHtml(
                school.status ||
                "Pending"
              )}

            </span>

            ${actions}

          </div>
        `;
      }).join("");

  } catch (error) {

    container.innerHTML = `

      <p class="error">

        Could not load schools:
        ${escapeHtml(
          error.message
        )}

      </p>
    `;
  }
}


/* =========================
   LOAD SUBSCRIPTIONS
========================= */

async function loadAdminSubscriptions() {

  const container =
    document.getElementById(
      "adminSubscriptions"
    );

  try {

    const renewals =
      await supabase(
        "/rest/v1/rpc/owner_list_subscription_renewals",
        {
          method: "POST"
        }
      );

    if (
      !renewals ||
      !renewals.length
    ) {

      container.innerHTML =
        "<p>No subscription renewal requests found.</p>";

      return;
    }

    container.innerHTML =
      renewals.map(renewal => {

        const status =
          String(
            renewal.status ||
            "pending"
          ).toLowerCase();

        let statusClass =
          "status-pending";

        if (
          status === "approved"
        ) {

          statusClass =
            "status-approved";

        } else if (
          status === "rejected"
        ) {

          statusClass =
            "status-rejected";
        }

        const renewalData =
          encodeURIComponent(
            JSON.stringify(renewal)
          );

        return `

          <div class="renewal">

            <strong>
              ${escapeHtml(
                renewal.school_name ||
                renewal.name ||
                "School"
              )}
            </strong>

            <br>

            Amount:

            <strong>
              L$${Number(
                renewal.amount || 0
              ).toLocaleString()}
            </strong>

            <br>

            Status:

            <span
              class="status ${statusClass}">

              ${escapeHtml(
                renewal.status ||
                "Pending"
              )}

            </span>

            <br>

            <button
              class="warning-btn small-btn"
              onclick="reviewSubscriptionEncoded(
                '${renewalData}'
              )">

              👁️ Review

            </button>

          </div>

        `;
      }).join("");

  } catch (error) {

    container.innerHTML = `

      <p class="error">

        Could not load subscription requests:
        ${escapeHtml(
          error.message
        )}

      </p>
    `;
  }
}


/* =========================
   REVIEW SUBSCRIPTION
========================= */

function reviewSubscriptionEncoded(
  encoded
) {

  try {

    const renewal =
      JSON.parse(
        decodeURIComponent(encoded)
      );

    reviewSubscription(
      renewal
    );

  } catch {

    alert(
      "Could not open this subscription request."
    );
  }
}


function reviewSubscription(
  renewal
) {

  const renewalId =
    renewal.id ||
    renewal.renewal_id;

  if (!renewalId) {

    alert(
      "This subscription request does not have a valid ID."
    );

    return;
  }

  const status =
    String(
      renewal.status ||
      "pending"
    ).toLowerCase();

  let actionButtons = "";

  if (
    status === "pending"
  ) {

    actionButtons = `

      <button
        class="success-btn"
        onclick="approveSubscription(
          '${escapeJs(renewalId)}'
        )">

        ✓ Approve Subscription

      </button>

      <button
        class="danger-btn"
        onclick="rejectSubscription(
          '${escapeJs(renewalId)}'
        )">

        ✕ Reject Subscription

      </button>

    `;
  }

  app.innerHTML = `

    <h2>👁️ Review Subscription</h2>

    <div class="card">

      <h3>
        Subscription Renewal Details
      </h3>

      <div class="review-box">

        <div class="review-row">

          <span>School</span>

          <strong>
            ${escapeHtml(
              renewal.school_name ||
              renewal.name ||
              "N/A"
            )}
          </strong>

        </div>

        <div class="review-row">

          <span>Amount</span>

          <strong>
            L$${Number(
              renewal.amount || 0
            ).toLocaleString()}
          </strong>

        </div>

        <div class="review-row">

          <span>
            Transaction Reference
          </span>

          <strong>
            ${escapeHtml(
              renewal.transaction_reference ||
              renewal.reference ||
              "N/A"
            )}
          </strong>

        </div>

        <div class="review-row">

          <span>Status</span>

          <strong>
            ${escapeHtml(
              renewal.status ||
              "Pending"
            )}
          </strong>

        </div>

        <div class="review-row">

          <span>Submitted</span>

          <strong>
            ${
              renewal.submitted_at
                ? new Date(
                    renewal.submitted_at
                  ).toLocaleString()
                : renewal.created_at
                  ? new Date(
                      renewal.created_at
                    ).toLocaleString()
                  : "N/A"
            }
          </strong>

        </div>

        <div class="review-row">

          <span>Notes</span>

          <strong>
            ${escapeHtml(
              renewal.notes ||
              "N/A"
            )}
          </strong>

        </div>

      </div>

      <br>

      ${actionButtons}

      <button
        class="secondary"
        onclick="showAdminDashboard()">

        ← Back to Owner Dashboard

      </button>

    </div>
  `;
}


/* =========================
   APPROVE SUBSCRIPTION
========================= */

async function approveSubscription(
  renewalId
) {

  if (!confirm(
    "Approve this subscription renewal?"
  )) {
    return;
  }

  try {

    await supabase(
      "/rest/v1/rpc/approve_subscription_renewal",
      {
        method: "POST",

        body: JSON.stringify({
          p_renewal_id:
            renewalId
        })
      }
    );

    alert(
      "Subscription renewal approved successfully."
    );

    await showAdminDashboard();

  } catch (error) {

    alert(
      "Could not approve subscription:\n\n" +
      error.message
    );
  }
}


/* =========================
   REJECT SUBSCRIPTION
========================= */

async function rejectSubscription(
  renewalId
) {

  if (!confirm(
    "Reject this subscription renewal?"
  )) {
    return;
  }

  try {

    await supabase(
      "/rest/v1/rpc/reject_subscription_renewal",
      {
        method: "POST",

        body: JSON.stringify({
          p_renewal_id:
            renewalId
        })
      }
    );

    alert(
      "Subscription renewal rejected."
    );

    await showAdminDashboard();

  } catch (error) {

    alert(
      "Could not reject subscription:\n\n" +
      error.message
    );
  }
}


/* =========================
   LOGOUT
========================= */

function logout() {

  accessToken = "";

  localStorage.removeItem(
    "schoolpay_token"
  );

  showLogin();
}


/* =========================
   START APP
========================= */

showLogin();

</script>
