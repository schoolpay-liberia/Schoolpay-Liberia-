<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SchoolPay Liberia</title><style>body{font-family:Arial;margin:0;background:#f4f7fb;color:#172033}header{background:#0b5cff;color:white;padding:20px}main{max-width:760px;margin:auto;padding:18px}.card{background:white;padding:20px;border-radius:15px;margin:14px 0;box-shadow:0 3px 15px #0001}input,select,button{width:100%;padding:13px;margin:7px 0;border-radius:9px;font-size:16px;box-sizing:border-box}input,select{border:1px solid #ddd}button{border:0;background:#0b5cff;color:white;font-weight:bold}.secondary{background:#eaf0ff;color:#0b5cff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat{background:#f4f7ff;padding:15px;border-radius:10px}.stat b{display:block;font-size:24px;margin-top:5px}.ok{background:#e8f7ed;padding:12px;border-radius:9px}</style></head><body><header><h1>🏫 SchoolPay Liberia</h1><p>School management • Payments • Subscriptions</p></header><main id="app"></main><script>
const app=document.getElementById("app"),URL="https://kojknrbjhrkctuefvrpp.supabase.co",KEY="sb_publishable_fs3RMvWadGqx55xdFrosxQ_34LtxiFA";let sb;
async function connect(){try{let m=await import("https://esm.sh/@supabase/supabase-js@2");sb=m.createClient(URL,KEY);return 1}catch(e){return 0}}
function login(){app.innerHTML='<div class="card"><h2>School Login</h2><input id="email" placeholder="Email"><input id="pass" type="password" placeholder="Password"><button onclick="schoolLogin()">Login</button><button class="secondary" onclick="registerSchool()">Register Your School</button><button class="secondary" onclick="adminLogin()">Owner / Admin</button></div>'}
async function schoolLogin(){if(!sb&&!await connect())return alert("Secure connection failed.");let r=await sb.auth.signInWithPassword({email:email.value,password:pass.value});if(r.error)return alert(r.error.message);schoolDash()}
function registerSchool(){app.innerHTML='<div class="card"><h2>Register Your School</h2><input id="sn" placeholder="School name"><input id="cn" placeholder="Contact person"><input id="cp" placeholder="Phone"><input id="ce" placeholder="Email"><input id="rp" type="password" placeholder="Password"><button onclick="submitReg()">Submit Registration</button><button class="secondary" onclick="login()">Back</button></div>'}
async function submitReg(){if(!sb&&!await connect())return alert("Secure connection failed.");let r=await sb.auth.signUp({email:ce.value,password:rp.value});if(r.error)return alert(r.error.message);let x=await sb.rpc("register_school",{p_name:sn.value,p_contact_name:cn.value,p_contact_phone:cp.value,p_contact_email:ce.value,p_logo_url:null});if(x.error)return alert(x.error.message);alert("Registration submitted for owner approval.");login()}
async function schoolDash(){app.innerHTML='<h2>School Dashboard</h2><div class="grid"><div class="stat">Students<b id="sc">—</b></div><div class="stat">Payments<b>L$—</b></div></div><div class="card"><div class="ok">Secure school account connected.</div><button onclick="students()">Students</button><button onclick="payments()">Payments</button><button onclick="renew()">Subscription / Renewal</button></div><button class="secondary" onclick="logout()">Log out</button>';let r=await sb.from("students").select("id",{count:"exact",head:true});if(!r.error)sc.textContent=r.count??0}
function students(){app.innerHTML='<div class="card"><h2>Students</h2><input id="stn" placeholder="Student name"><input id="sid" placeholder="Student ID"><select id="grade"><option>Class / Grade</option><option>Grade 7</option><option>Grade 8</option><option>Grade 9</option><option>Grade 10</option><option>Grade 11</option><option>Grade 12</option></select><button onclick="addStudent()">Save Student</button><button class="secondary" onclick="schoolDash()">Back</button></div>'}
async function addStudent(){let r=await sb.from("students").insert({student_name:stn.value,student_id:sid.value,grade:grade.value});if(r.error)return alert(r.error.message);alert("Student saved.");schoolDash()}
function payments(){app.innerHTML='<div class="card"><h2>Record Payment</h2><input id="pn" placeholder="Student ID"><input id="amt" type="number" placeholder="Amount (L$)"><input id="ref" placeholder="Transaction reference"><button onclick="addPayment()">Record Payment</button><button class="secondary" onclick="schoolDash()">Back</button></div>'}
async function addPayment(){let r=await sb.from("payments").insert({student_id:pn.value,amount:amt.value,transaction_reference:ref.value});if(r.error)return alert(r.error.message);alert("Payment recorded.");schoolDash()}
function renew(){app.innerHTML='<div class="card"><h2>Subscription Renewal</h2><p>Send renewal request for owner approval.</p><input id="ra" type="number" placeholder="Amount (L$)"><input id="rr" placeholder="Transaction reference"><button onclick="sendRenew()">Submit Renewal</button><button class="secondary" onclick="schoolDash()">Back</button></div>'}
async function sendRenew(){let r=await sb.rpc("submit_subscription_renewal",{p_amount:ra.value,p_transaction_reference:rr.value,p_notes:"SchoolPay renewal"});if(r.error)return alert(r.error.message);alert("Renewal submitted.");schoolDash()}
function adminLogin(){app.innerHTML='<div class="card"><h2>Owner Admin</h2><input id="ae" placeholder="Admin email"><input id="ap" type="password" placeholder="Admin password"><button onclick="admin()">Sign In</button><button class="secondary" onclick="login()">Back</button></div>'}
async function admin(){if(!sb&&!await connect())return alert("Secure connection failed.");let r=await sb.auth.signInWithPassword({email:ae.value,password:ap.value});if(r.error)return alert(r.error.message);let o=await sb.rpc("is_owner");if(o.error||!o.data)return alert("This account is not an owner account.");adminDash()}
async function adminDash(){let s=await sb.from("schools").select("*").order("created_at",{ascending:false});let rows=s.data||[];app.innerHTML='<h2>Owner Admin Dashboard</h2><div class="card"><h3>Schools</h3>'+((rows.map(x=>'<p><b>'+x.name+'</b> — '+x.status+'</p>').join(''))||'<p>No schools yet.</p>')+'</div><div class="card"><h3>Subscriptions</h3><p>Review school subscription status and renewals.</p></div><button class="secondary" onclick="logout()">Log out</button>'}
async function logout(){await sb?.auth.signOut();login()}connect();login();
</script></main></body></html>
